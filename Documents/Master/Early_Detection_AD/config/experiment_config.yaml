# config/experiment_config.yaml

# WHY this structure?
# Each experiment ID uniquely identifies one combination of:
# feature_type × fusion_type × pipeline × classifier
# This lets run_all_experiments.py loop through all combinations
# from one config file without changing any code.
# ============================================================
# TASKS
# ============================================================

tasks:
  binary:
    - "cn_vs_ad"
    - "cn_vs_emci"
    - "cn_vs_lmci"

  multiclass:
    - "four_class"


# ============================================================
# EVALUATION
# ============================================================

evaluation:

  cv_folds: 5

  selection_metric: "balanced_accuracy"

  imbalance_strategy: "class_weight"

  random_state: 42

  use_validation: true

  test_once: false


# ============================================================
# CLASSIFIERS
# ============================================================

# Classifier definitions belong here because they describe
# EXPERIMENTAL MODEL CONFIGURATION, not dataset configuration.

classifiers:

  rf:
    class_weight: balanced
    n_estimators: 300
    random_state: 42

  svm:
    class_weight: balanced
    probability: true
    random_state: 42

  logistic_regression:
    class_weight: balanced
    random_state: 42

  mlp:
    hidden_layer_sizes: [32, 16]
    activation: relu
    solver: adam

    alpha: 0.0001

    learning_rate_init: 0.001

    max_iter: 300

    batch_size: 32

    early_stopping: true
    validation_fraction: 0.15
    n_iter_no_change: 20

    tol: 0.0001

    random_state: 42

quantum_classifiers:

  vqc:                    # single-scale (6 features)
    n_qubits: 6
    n_layers: 2
    epochs: 40
    learning_rate: 0.01
    
    batch_size: 64
    early_stopping: true
    patience: 8
    device: "lightning.gpu"    # ← RTX 3080    random_state: 42

  vqc_fused:              # feature-level fusion (18 features)
    n_qubits: 18
    n_layers: 2
    epochs: 40
    learning_rate: 0.01
    batch_size: 64
    early_stopping: true
    patience: 8
    device: "lightning.gpu"    # ← RTX 3080
    random_state: 42

# ============================================================
# EXPERIMENTS
# ============================================================

experiments:

  # ----------------------------------------------------------
  # SINGLE-SCALE GLCM
  # ----------------------------------------------------------

  - id: "glcm_narrow_vqc_cuda"
    feature_type: "glcm"
    fusion_type: "narrow"
    pipeline: "quantum"
    classifier: "vqc"

  - id: "glcm_original_vqc_cuda"
    feature_type: "glcm"
    fusion_type: "original"
    pipeline: "quantum"
    classifier: "vqc"

  - id: "glcm_wide_vqc_cuda"
    feature_type: "glcm"
    fusion_type: "wide"
    pipeline: "quantum"
    classifier: "vqc"


  # ----------------------------------------------------------
  # FEATURE-LEVEL FUSION
  # ----------------------------------------------------------

  - id: "glcm_feature_vqc_cuda"
    feature_type: "glcm"
    fusion_type: "feature"
    pipeline: "quantum"
    classifier: "vqc_fused"  # use vqc_fused not vqc q = 3 x 6 = 18 features


  # ----------------------------------------------------------
  # DECISION-LEVEL FUSION
  # ----------------------------------------------------------

  - id: "glcm_decision_vqc_cuda"
    feature_type: "glcm"
    fusion_type: "decision"
    pipeline: "quantum"
    classifier: "vqc"

